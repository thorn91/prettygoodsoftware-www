<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The Pretty Good Software mark: two circles, r=30 on a 100 grid, grape
       at (40,60), vermilion at (60,40). The lens is drawn explicitly
       (vermilion clipped by the grape circle, filled with the multiplied
       color) because favicon renderers cannot be trusted with
       mix-blend-mode. -->
  <rect width="100" height="100" fill="#ECEBE5"/>
  <clipPath id="lens"><circle cx="40" cy="60" r="30"/></clipPath>
  <circle cx="40" cy="60" r="30" fill="#4B3A8C"/>
  <circle cx="60" cy="40" r="30" fill="#E14424"/>
  <circle cx="60" cy="40" r="30" fill="#420F13" clip-path="url(#lens)"/>
</svg>
