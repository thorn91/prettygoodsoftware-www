<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Pretty Good Software mark: the hero's two riso inks overprinting.
       The lens is drawn explicitly (vermilion clipped by the grape circle,
       filled with the multiplied color) because favicon renderers cannot be
       trusted with mix-blend-mode. -->
  <rect width="64" height="64" fill="#F3EBDA"/>
  <clipPath id="lens"><circle cx="26" cy="39" r="17"/></clipPath>
  <circle cx="40" cy="26" r="20" fill="#E14424"/>
  <circle cx="26" cy="39" r="17" fill="#4B3A8C"/>
  <circle cx="40" cy="26" r="20" fill="#420F13" clip-path="url(#lens)"/>
</svg>
